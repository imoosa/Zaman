<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Samaa Calendar{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Liturgical Theme Engine -- today's Christian liturgical season sets
           this accent, used as a thin app-wide highlight (topbar underline +
           a small badge) rather than overriding the app's core Samaa teal/gold
           branding wholesale. */
        :root{ --liturgical-accent: {{ liturgical_color_hex }}; }
        .topbar{ border-bottom: 3px solid var(--liturgical-accent); }
        .liturgical-badge{
            display:inline-flex; align-items:center; gap:5px; font-size:11px;
            color:#666; margin-left:10px; padding:2px 8px; border-radius:10px;
            background:color-mix(in srgb, var(--liturgical-accent) 12%, transparent);
        }
        .liturgical-badge .dot{
            width:8px; height:8px; border-radius:50%; background:var(--liturgical-accent);
            display:inline-block;
        }

        /* [certain] style.css's `@media (max-width: 900px)` block is where
           .menu switches to `position:fixed` and becomes the bottom tab
           bar (confirmed by reading style.css). body.nav-bottom-fixed is
           still set by JS from the runtime computed position as a belt-
           and-braces check, but the media query below is now the
           authoritative gate, not a guess. */
        .menu-brand-link{ display:none; }
        body.nav-bottom-fixed .menu-brand-link{
            display:flex; align-items:center; justify-content:center; flex:1;
        }
        body.nav-bottom-fixed .topbar > .brand{ display:none; }

        /* Hard gate: nav-bottom-fixed comes from a runtime layout check
           (applyMobileNavOffset() below), which is one resize/paint race
           away from being wrong -- the screenshot was exactly that: the
           class got set on a desktop-width viewport, so the round mobile
           mark showed inline in the menu instead of the normal side logo.
           901px mirrors style.css's own 900px breakpoint exactly, so this
           !important-overrides whatever state the JS lands on and desktop
           always shows the side logo + menu, never the round mark. */
        @media (min-width: 901px){
            .menu-brand-link{ display:none !important; }
            .topbar > .brand{ display:flex !important; align-items:center; }
        }

        /* Redundant once the logo itself links to Calendar in mobile mode --
           kept for desktop, where the topbar logo and this nav list are two
           separate, smaller elements and the label still earns its space. */
        body.nav-bottom-fixed .calendar-nav-link{ display:none; }

        /* Raised, ring-highlighted center logo button for the mobile bottom
           bar. Sized up from 26px and floated above the bar (like a FAB)
           so it reads as a distinct, tappable control rather than a small
           decorative icon sitting flush in a row of text tabs. */
        .menu-brand-link{
            position: relative;
            margin-top: -22px;
        }
        .brand-icon-mobile{
            width: 46px; height: 46px; object-fit: contain; display: block;
            border-radius: 50%;
            padding: 7px;
            background: radial-gradient(circle at 32% 28%, #ffffff, #dcdcdc 55%, #a8a8a8 100%);
            box-shadow:
                0 0 0 3px #f4f4f4,
                0 0 0 4px rgba(140,140,140,.55),
                0 3px 10px rgba(0,0,0,.28),
                inset 0 0 5px rgba(255,255,255,.9);
            transition: box-shadow .18s ease, transform .12s ease;
        }
        /* Pressed state -- toggled by JS on touchstart (see syncMobileNav()
           script below) rather than relying solely on :active, since :active
           is unreliable/delayed on mobile Safari and this needs to feel
           instant to read as a real button, not decoration. */
        .menu-brand-link.pressed .brand-icon-mobile,
        .menu-brand-link:active .brand-icon-mobile{
            transform: scale(.94);
            box-shadow:
                0 0 0 3px #f4f4f4,
                0 0 0 7px rgba(120,120,120,.75),
                0 0 16px 3px rgba(160,160,160,.65),
                inset 0 0 6px rgba(255,255,255,1);
        }

        /* Opening/splash screen -- mobile only (matches style.css's real
           900px breakpoint, same one used above for the logo fix). Desktop
           never sees this: display:none outside the media query, and the
           JS below removes the node outright on wide viewports too, so it
           can never flash on screen there even for a frame. */
        .app-splash{ display:none; }
        @media (max-width: 900px){
            .app-splash{
                display:flex; align-items:center; justify-content:center;
                position:fixed; inset:0; z-index:1000;
                background:#fff;
                transition:opacity .35s ease;
            }
            .app-splash.app-splash-hide{ opacity:0; pointer-events:none; }
            .app-splash-logo{
                width:100px; height:100px; object-fit:contain;
                /* Bounce IN once (overshoot then settle), then hand off to
                   a slower, gentler idle bounce that loops until the splash
                   is dismissed -- the two animations are named separately
                   so the idle loop can't restart the overshoot each cycle. */
                animation:
                    app-splash-bounce-in .7s cubic-bezier(.34,1.56,.64,1) both,
                    app-splash-idle-bounce 1.2s ease-in-out .7s infinite;
            }
            @keyframes app-splash-bounce-in{
                0%  { transform:scale(.3) translateY(50px); opacity:0; }
                55% { transform:scale(1.1) translateY(-10px); opacity:1; }
                75% { transform:scale(.95) translateY(4px); }
                100%{ transform:scale(1) translateY(0); }
            }
            @keyframes app-splash-idle-bounce{
                0%, 100% { transform:translateY(0); }
                50%      { transform:translateY(-12px); }
            }
            @media (prefers-reduced-motion: reduce){
                .app-splash-logo{ animation:none; }
            }
        }
    </style>
</head>
<body>
    <div id="app-splash" class="app-splash" aria-hidden="true">
        <img src="{{ url_for('static', filename='icons/zaman_logo_bg.png') }}" alt="" class="app-splash-logo">
    </div>
    <script>
        // Runs before the rest of the page paints, so the splash is the
        // first thing visible on mobile with no flash-of-content. Gated
        // two ways: viewport width (CSS already hides it on desktop, this
        // just skips the JS/sessionStorage work there too) and
        // sessionStorage, so a multi-page nav click doesn't replay it --
        // it's an "app open" moment, not a per-page one.
        (function(){
            var splash = document.getElementById('app-splash');
            if (!splash) return;
            if (window.innerWidth > 900){ splash.remove(); return; }
            var SHOWN_KEY = 'app-splash-shown';
            if (sessionStorage.getItem(SHOWN_KEY)){ splash.remove(); return; }
            sessionStorage.setItem(SHOWN_KEY, '1');
            setTimeout(function(){
                splash.classList.add('app-splash-hide');
                setTimeout(function(){ splash.remove(); }, 350);
            }, 1800);
        })();
    </script>
    <header class="topbar">
        <span class="brand">
            <a href="{{ url_for('calendar_view') }}" title="Calendar">
                <img src="{{ url_for('static', filename='icons/zaman_logo_bg.png') }}" alt="Zaman" class="brand-icon">
            </a>
        </span>
        <span class="liturgical-badge" title="Christian liturgical season, sets today's accent color"><span class="dot"></span>{{ liturgical_season_name }}</span>
        <nav class="menu">
            <a href="{{ url_for('today_view') }}" class="{{ 'active' if active == 'today' else '' }}">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"></path></svg>
                <span class="nav-label">Today</span>
            </a>
            <a href="{{ url_for('calendar_view') }}" class="calendar-nav-link {{ 'active' if active == 'calendar' else '' }}">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span class="nav-label">Calendar</span>
            </a>
            <a href="{{ url_for('prayer_view') }}" class="{{ 'active' if active == 'prayer' else '' }}">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                <span class="nav-label">Prayer Times</span>
            </a>
            
            
            <!-- Mobile-only brand mark, sits in the middle of the bottom nav bar.
                 Hidden by default (see .menu-brand-link in <style>); shown only
                 once JS confirms .menu is actually rendered as the fixed bottom
                 bar (see syncMobileNav() near the bottom of this file), so this
                 never depends on guessing style.css's breakpoint. -->
            <a href="{{ url_for('calendar_view') }}" class="menu-brand-link" title="Calendar" aria-label="Calendar">
                <img src="{{ url_for('static', filename='icons/zaman_logo_bg.png') }}" alt="Calendar" class="brand-icon-mobile">
            </a>
            
            
            <a href="{{ url_for('vastu_view') }}" class="{{ 'active' if active == 'vastu' else '' }}">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"></path><path d="M9 21V9h6v12"></path></svg>
                <span class="nav-label">Vastu</span>
            </a>
            <a href="{{ url_for('settings_view') }}" class="{{ 'active' if active == 'settings' else '' }}">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
                <span class="nav-label">Settings</span>
            </a>
        </nav>
    </header>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
        <div class="flash">{{ m }}</div>
        {% endfor %}
        <style>
            /* Auto-dismiss: fade starts at 1.6s so the message is fully gone
               by the 2s mark, not 2s-then-fade (which would overshoot it). */
            .flash{ transition: opacity .4s ease, transform .4s ease; }
            .flash.flash-hide{ opacity:0; transform:translateY(-6px); pointer-events:none; }
        </style>
        <script>
            document.querySelectorAll('.flash').forEach(function(el){
                setTimeout(function(){
                    el.classList.add('flash-hide');
                    setTimeout(function(){ el.remove(); }, 400);
                }, 1600);
            });
        </script>
      {% endif %}
    {% endwith %}

    <style>
        /* Sidebar column removed -- main-content now has the full width
           to itself. [guessing] mechanism: this overrides whatever
           style.css sets via source order (this tag renders after the
           linked stylesheet). I don't have style.css, so if layout still
           looks off after this, that file may need a matching edit --
           send it over and I'll match the real mechanism. */
        .main-content{ width: 100%; max-width: none; }

        /* Notes widget -- now a single floating card on every page instead
           of living inside the old collapsible sidebar. It's fixed to the
           viewport and draggable everywhere, not just on mobile, so there's
           exactly one notes surface in the whole app (the toolbar "Note"
           button on calendar.html just calls openStickyNote() below to
           reopen this same card -- no second note system anymore). */
        .notes-widget{
            position:fixed;
            right:16px; bottom:16px;
            z-index:60; /* stays under calendar.html's modal-overlay (z-index:100) so Add Event still covers it */
            width:230px;
        }

        .sticky-note-card{
            background:#fff8d6;border-radius:8px;
            box-shadow:0 4px 14px rgba(0,0,0,.16);
            overflow:hidden;display:flex;flex-direction:column;
        }
        .notes-header{
            display:flex;align-items:center;justify-content:space-between;
            padding:6px 8px;
            cursor:grab;
            touch-action:none; /* stops the page from scrolling under your finger while dragging the header */
        }
        .notes-header:active{cursor:grabbing;}
        .notes-drag-dots{color:#00000045;font-size:13px;letter-spacing:2px;user-select:none;}
        .notes-header-actions{display:flex;gap:2px;}
        .notes-icon-btn{
            border:none;background:none;cursor:pointer;color:#4a4326;
            width:24px;height:24px;border-radius:4px;font-size:13px;
            display:inline-flex;align-items:center;justify-content:center;padding:0;
        }
        .notes-icon-btn:hover{background:#00000012;}
        /* Only "..." is still disabled -- there's genuinely nothing to put
           in that menu yet. "+" now does something real (see JS). */
        .notes-icon-btn:disabled{opacity:.4;cursor:default;}
        .notes-icon-btn:disabled:hover{background:none;}

        .notes-toolbar{display:flex;align-items:center;gap:2px;
            padding:6px 8px;border-top:1px solid rgba(0,0,0,.08);}
        .notes-toolbar button#note-bold-btn{font-weight:700;}
        .notes-toolbar button#note-italic-btn{font-style:italic;}
        .notes-toolbar button#note-underline-btn{text-decoration:underline;}
        .note-save-status{margin-left:auto;font-size:11px;color:#8a8360;}

        .sticky-note{min-height:150px;background:transparent;
            box-shadow:none;padding:4px 14px 10px;font-size:13.5px;
            line-height:1.55;outline:none;white-space:pre-wrap;}
        .sticky-note:empty::before{content:attr(data-placeholder);color:#a89a5c;}
        .sticky-note ul,.sticky-note ol{margin:4px 0 4px 18px;padding:0;}

        /* Collapsed -- hides body + toolbar, leaves the header bar as a
           thin strip. */
        .sticky-note-card.collapsed .sticky-note,
        .sticky-note-card.collapsed .notes-toolbar{
            display:none;
        }

        /* Reopen pill shown only when the card has been closed via the X --
           without this, closing the note would be a one-way trip with no
           way back short of clearing localStorage. */
        .note-reopen-btn{position:fixed;right:16px;bottom:16px;z-index:60;
            border:1px dashed #ccc;background:#fff;
            border-radius:6px;padding:6px 10px;font-size:12px;color:#777;cursor:pointer;
            display:none;}
        .note-reopen-btn:hover{background:#f4f1ea;}
    </style>

    <div class="app-body">
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

        <div class="notes-widget">
            <div class="sticky-note-card">
                <div class="notes-header">
                    <span class="notes-drag-dots" title="Drag to move">::::</span>
                    <div class="notes-header-actions">
                        <button type="button" id="note-collapse-btn" class="notes-icon-btn" title="Collapse/expand">&minus;</button>
                        <button type="button" id="note-new-btn" class="notes-icon-btn" title="Clear this note and start fresh">+</button>
                        <button type="button" class="notes-icon-btn" title="Nothing to put in this menu yet" disabled>&#8942;</button>
                        <button type="button" id="note-close-btn" class="notes-icon-btn" title="Hide">&times;</button>
                    </div>
                </div>

                <div id="sticky-note" class="sticky-note" contenteditable="true"
                     data-placeholder="Write something important&hellip;">{{ sidebar_note_content|safe }}</div>

                <div class="notes-toolbar">
                    <button type="button" id="note-bold-btn" class="notes-icon-btn" title="Bold the selected text">B</button>
                    <button type="button" id="note-italic-btn" class="notes-icon-btn" title="Italic the selected text">I</button>
                    <button type="button" id="note-underline-btn" class="notes-icon-btn" title="Underline the selected text">U</button>
                    <button type="button" id="note-bullet-btn" class="notes-icon-btn" title="Bullet list">&#9776;</button>
                    <button type="button" id="note-number-btn" class="notes-icon-btn" title="Numbered list">1.</button>
                    <button type="button" id="note-image-btn" class="notes-icon-btn"
                            title="Not wired to a backend yet -- see the sanitizer note below">&#128247;</button>
                    <span id="note-save-status" class="note-save-status"></span>
                </div>
            </div>
            <button type="button" id="note-reopen-btn" class="note-reopen-btn">+ Note</button>
        </div>
    </div>

    <script>
    (function(){
        var note = document.getElementById('sticky-note');
        var status = document.getElementById('note-save-status');
        var saveTimer = null;

        function saveNote(){
            status.textContent = 'Saving…';
            fetch('{{ url_for("save_note") }}', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'content=' + encodeURIComponent(note.innerHTML)
            }).then(function(r){
                status.textContent = r.ok ? 'Saved' : 'Could not save';
                setTimeout(function(){ status.textContent = ''; }, 1500);
            }).catch(function(){
                status.textContent = 'Could not save';
            });
        }

        note.addEventListener('input', function(){
            clearTimeout(saveTimer);
            status.textContent = '';
            saveTimer = setTimeout(saveNote, 800);
        });
        note.addEventListener('blur', saveNote);

        // execCommand is deprecated but still the simplest way to get basic
        // rich-text toggling in a contenteditable box without pulling in a
        // whole editor library -- fine for five buttons.
        function bindCmd(id, cmd){
            document.getElementById(id).addEventListener('click', function(){
                document.execCommand(cmd);
                note.focus();
            });
        }
        bindCmd('note-bold-btn', 'bold');
        bindCmd('note-italic-btn', 'italic');
        bindCmd('note-underline-btn', 'underline');
        bindCmd('note-bullet-btn', 'insertUnorderedList');
        bindCmd('note-number-btn', 'insertOrderedList');

        // Close/reopen -- persisted so an accidental close doesn't feel
        // like the note vanished. Card and pill states are always kept
        // as exact opposites of each other.
        var widget = document.querySelector('.notes-widget');
        var card = document.querySelector('.sticky-note-card');
        var header = document.querySelector('.notes-header');
        var reopenBtn = document.getElementById('note-reopen-btn');

        // Detects whether .menu is actually rendered as a fixed bottom tab
        // bar (true on mobile per style.css, which we don't have a copy
        // of) by checking its real computed position/rect instead of
        // guessing a breakpoint. Toggles body.nav-bottom-fixed (used by the
        // .menu-brand-link CSS above) and pushes the note card + its
        // reopen pill up so they clear the bar instead of overlapping it.
        var navEl = document.querySelector('.topbar .menu');
        function applyMobileNavOffset(){
            if (!navEl) return;
            var rect = navEl.getBoundingClientRect();
            var fixedToBottom = getComputedStyle(navEl).position === 'fixed' &&
                rect.bottom >= window.innerHeight - 2;
            document.body.classList.toggle('nav-bottom-fixed', fixedToBottom);
            var clearance = fixedToBottom ? (window.innerHeight - rect.top) + 16 : 16;
            widget.style.bottom = clearance + 'px';
            reopenBtn.style.bottom = clearance + 'px';
        }
        applyMobileNavOffset();
        window.addEventListener('resize', applyMobileNavOffset);

        // Manual pressed-state toggle for the center logo button -- CSS
        // :active alone is too laggy/inconsistent on mobile Safari to read
        // as "this is a button", so touchstart/touchend drive it directly.
        var brandLink = document.querySelector('.menu-brand-link');
        if (brandLink){
            var pressOn = function(){ brandLink.classList.add('pressed'); };
            var pressOff = function(){ brandLink.classList.remove('pressed'); };
            brandLink.addEventListener('touchstart', pressOn, {passive:true});
            brandLink.addEventListener('touchend', pressOff);
            brandLink.addEventListener('touchcancel', pressOff);
        }

        var HIDE_KEY = 'sticky-note-hidden';
        function setHidden(hidden){
            card.style.display = hidden ? 'none' : '';
            reopenBtn.style.display = hidden ? 'inline-block' : 'none';
            localStorage.setItem(HIDE_KEY, hidden ? '1' : '0');
        }
        document.getElementById('note-close-btn').addEventListener('click', function(){ setHidden(true); });
        reopenBtn.addEventListener('click', function(){ setHidden(false); });
        setHidden(localStorage.getItem(HIDE_KEY) === '1');

        // Single entry point for reopening the note from anywhere else in
        // the app -- e.g. calendar.html's toolbar "Note" button.
        window.openStickyNote = function(){ setHidden(false); note.focus(); };

        // "+" -- there's only one note slot (see database.py's Note model),
        // so this can't create a second note. What it CAN honestly do is
        // clear the current one so you're starting fresh, same as opening
        // a blank Windows sticky note -- with a confirm so a stray tap
        // doesn't wipe something you meant to keep.
        document.getElementById('note-new-btn').addEventListener('click', function(){
            if (note.textContent.trim() === '' || confirm('Clear the current note and start a new one?')) {
                note.innerHTML = '';
                note.focus();
                saveNote();
            }
        });

        // Collapse -- shrinks the card to just its header bar. Works on
        // any screen size, not only mobile; nothing stops you from using
        // it on desktop too.
        var COLLAPSE_KEY = 'sticky-note-collapsed';
        var collapseBtn = document.getElementById('note-collapse-btn');
        function setCollapsed(collapsed){
            card.classList.toggle('collapsed', collapsed);
            collapseBtn.innerHTML = collapsed ? '&#9633;' : '&minus;';
            collapseBtn.title = collapsed ? 'Expand' : 'Collapse';
            localStorage.setItem(COLLAPSE_KEY, collapsed ? '1' : '0');
        }
        collapseBtn.addEventListener('click', function(){
            setCollapsed(!card.classList.contains('collapsed'));
        });
        setCollapsed(localStorage.getItem(COLLAPSE_KEY) === '1');

        // Deliberately NOT wired to insertImage/execCommand -- that would
        // embed a base64 data: URI, and _NOTE_ALLOWED_TAGS in main.py has
        // no img entry, so sanitize_note_html would strip it back out on
        // the very next save. Shipping a button that silently loses your
        // image is worse than no button, so this says so instead.
        document.getElementById('note-image-btn').addEventListener('click', function(){
            alert('Image notes need a small backend change first (main.py: add "img" to _NOTE_ALLOWED_TAGS, plus an upload endpoint). Not done yet -- ask if you want that built.');
        });

        // Drag the card around on any screen size, position persisted.
        var POS_KEY = 'sticky-note-pos';
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); } catch(e){}
        if (saved && typeof saved.left === 'number' && typeof saved.top === 'number'){
            widget.style.left = saved.left + 'px';
            widget.style.top = saved.top + 'px';
            widget.style.right = widget.style.bottom = '';
        }

        var dragging = false, startX, startY, startLeft, startTop;
        header.addEventListener('pointerdown', function(e){
            if (e.target.closest('button')) return; // header buttons still need to be tappable, not drag starters
            dragging = true;
            header.setPointerCapture(e.pointerId);
            var rect = widget.getBoundingClientRect();
            startX = e.clientX; startY = e.clientY;
            startLeft = rect.left; startTop = rect.top;
            widget.style.right = widget.style.bottom = '';
        });
        header.addEventListener('pointermove', function(e){
            if (!dragging) return;
            var left = startLeft + (e.clientX - startX);
            var top = startTop + (e.clientY - startY);
            left = Math.max(0, Math.min(window.innerWidth - widget.offsetWidth, left));
            top = Math.max(0, Math.min(window.innerHeight - widget.offsetHeight, top));
            widget.style.left = left + 'px';
            widget.style.top = top + 'px';
        });
        function endDrag(){
            if (!dragging) return;
            dragging = false;
            localStorage.setItem(POS_KEY, JSON.stringify({
                left: parseInt(widget.style.left, 10),
                top: parseInt(widget.style.top, 10)
            }));
        }
        header.addEventListener('pointerup', endDrag);
        header.addEventListener('pointercancel', endDrag);
    })();
    </script>
</body>
</html>
